<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Weather Forecast &amp; Climate Telemetry</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-default">
  <main class="app-container">
    <header class="app-header">
      <h1>Climate Telemetry</h1>
      <p class="subtitle">Real-time global weather &amp; 5-day forecast</p>

      <form id="search-form" class="search-form" novalidate>
        <input
          type="text"
          id="city-input"
          class="search-input"
          placeholder="Search any city (e.g., Bengaluru, Tokyo, London)..."
          aria-label="City name"
          required
        />
        <button type="submit" class="search-btn">Search</button>
      </form>
    </header>

    <!-- Loading Spinner -->
    <div id="loading" class="loading hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span>Fetching live telemetry...</span>
    </div>

    <!-- Error Message -->
    <div id="error-box" class="error-box hidden" role="alert">
      <p id="error-message"></p>
    </div>

    <!-- Main Weather Dashboard -->
    <section id="dashboard" class="dashboard hidden" aria-label="Weather telemetry">
      <div class="current-card">
        <div class="current-main">
          <div>
            <h2 id="city-name" class="city-name">--</h2>
            <p id="weather-desc" class="weather-desc">--</p>
          </div>
          <div class="temp-group">
            <img id="weather-icon" src="" alt="" class="weather-icon" />
            <span id="temperature" class="temperature">--°C</span>
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-item">
            <span class="metric-label">Humidity</span>
            <span id="humidity" class="metric-value">--%</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Wind Speed</span>
            <span id="wind-speed" class="metric-value">-- m/s</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Pressure</span>
            <span id="pressure" class="metric-value">-- hPa</span>
          </div>
        </div>
      </div>

      <div class="forecast-section">
        <h3 class="forecast-title">5-Day Forecast</h3>
        <div id="forecast-list" class="forecast-list"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
